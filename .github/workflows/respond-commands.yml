name: Dinner Bot Commands

on:
  schedule:
    # 5 minutes is the shortest interval GitHub allows for scheduled workflows.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dinner-bot-commands
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for and answer new commands
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 poll_once.py

      - name: Commit updated state, if any
        run: |
          if git diff --quiet -- bot/state.json; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot/state.json
          git commit -m "Update bot state [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), pulling and retrying..."
            git pull --rebase
          done
          echo "Failed to push updated state after retries."
          exit 1
